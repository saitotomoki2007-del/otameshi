<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yosou Markets</title>
    <meta
      name="description"
      content="選挙、スポーツ、経済、ニュースをみんなで予想するマーケット型コミュニティです。"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#markets" aria-label="Yosou Markets">
        <span class="brand-mark">Y</span>
        <span>Yosou Markets</span>
      </a>
      <label class="search">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="マーケットを検索" />
      </label>
      <div class="topbar-actions">
        <span id="connectionBadge" class="badge muted">Demo DB</span>
        <button id="createMarketButton" class="button ghost" type="button">作成</button>
        <button id="loginButton" class="button dark" type="button">ログイン</button>
      </div>
    </header>

    <main class="shell">
      <aside class="sidebar" aria-label="カテゴリ">
        <button class="topic-tab active" type="button" data-category="all">Trending</button>
        <button class="topic-tab" type="button" data-category="選挙">Politics</button>
        <button class="topic-tab" type="button" data-category="スポーツ">Sports</button>
        <button class="topic-tab" type="button" data-category="経済">Finance</button>
        <button class="topic-tab" type="button" data-category="ニュース">News</button>
        <button class="topic-tab" type="button" data-category="エンタメ">Culture</button>
        <button class="topic-tab" type="button" data-category="その他">Other</button>
        <div class="sidebar-card">
          <strong>共有DB</strong>
          <p>Supabase設定を入れると、投稿・コメント・ランキングが全員に共有されます。</p>
        </div>
      </aside>

      <section id="markets" class="market-column" aria-labelledby="marketTitle">
        <div class="column-head">
          <div>
            <p class="eyebrow">Prediction Markets</p>
            <h1 id="marketTitle">注目マーケット</h1>
          </div>
          <div class="stats-strip" aria-label="統計">
            <span><b id="statMarkets">0</b> markets</span>
            <span><b id="statPredictions">0</b> predictions</span>
            <span><b id="statResolved">0</b> resolved</span>
          </div>
        </div>
        <div id="marketList" class="market-list" aria-live="polite"></div>
      </section>

      <aside class="detail-column" aria-label="マーケット詳細">
        <section id="marketDetail" class="detail-card"></section>
        <section class="leaderboard-card">
          <div class="card-head">
            <h2>的中率ランキング</h2>
            <span id="rankingScope">Resolved</span>
          </div>
          <div id="leaderboardList" class="leaderboard-list"></div>
        </section>
      </aside>
    </main>

    <dialog id="authDialog" class="dialog">
      <form id="authForm" class="dialog-body">
        <div class="dialog-head">
          <div>
            <p class="eyebrow">Account</p>
            <h2>ログイン</h2>
          </div>
          <button class="icon-button" type="button" data-close="authDialog" aria-label="閉じる">×</button>
        </div>
        <p id="authHelp" class="help-text">
          Supabase接続時はメールのマジックリンクでログインします。未設定時はデモ名でログインします。
        </p>
        <label>
          表示名
          <input name="displayName" maxlength="24" placeholder="例: yuki" />
        </label>
        <label>
          メール
          <input name="email" type="email" placeholder="you@example.com" />
        </label>
        <button class="button dark" type="submit">ログインする</button>
      </form>
    </dialog>

    <dialog id="createDialog" class="dialog">
      <form id="marketForm" class="dialog-body">
        <div class="dialog-head">
          <div>
            <p class="eyebrow">New Market</p>
            <h2>マーケット作成</h2>
          </div>
          <button class="icon-button" type="button" data-close="createDialog" aria-label="閉じる">×</button>
        </div>
        <label>
          タイトル
          <input name="title" required maxlength="90" placeholder="例: 次の国政選挙の投票率は55%を超える？" />
        </label>
        <div class="form-grid">
          <label>
            カテゴリ
            <select name="category">
              <option>選挙</option>
              <option>スポーツ</option>
              <option>経済</option>
              <option>ニュース</option>
              <option>エンタメ</option>
              <option>その他</option>
            </select>
          </label>
          <label>
            締切
            <input name="deadline" type="date" required />
          </label>
        </div>
        <label>
          選択肢
          <input name="options" required placeholder="Yes, No または A候補, B候補" />
        </label>
        <label>
          判定条件
          <textarea name="description" rows="4" maxlength="220" placeholder="何をもって結果確定とするかを書いてください。"></textarea>
        </label>
        <button class="button dark" type="submit">公開する</button>
      </form>
    </dialog>

    <dialog id="predictDialog" class="dialog">
      <form id="predictionForm" class="dialog-body">
        <div class="dialog-head">
          <div>
            <p class="eyebrow">Forecast</p>
            <h2 id="predictionTitle">予想する</h2>
          </div>
          <button class="icon-button" type="button" data-close="predictDialog" aria-label="閉じる">×</button>
        </div>
        <input name="marketId" type="hidden" />
        <label>
          予想
          <select name="optionId" required></select>
        </label>
        <label>
          確信度 <span id="confidenceValue">65%</span>
          <input name="confidence" type="range" min="10" max="100" value="65" step="5" />
        </label>
        <label>
          根拠
          <textarea name="reason" rows="4" maxlength="180" placeholder="根拠や見立てを短く書いてください。"></textarea>
        </label>
        <button class="button dark" type="submit">予想を投稿</button>
      </form>
    </dialog>

    <dialog id="resolveDialog" class="dialog">
      <form id="resolveForm" class="dialog-body">
        <div class="dialog-head">
          <div>
            <p class="eyebrow">Resolve</p>
            <h2>結果を確定</h2>
          </div>
          <button class="icon-button" type="button" data-close="resolveDialog" aria-label="閉じる">×</button>
        </div>
        <input name="marketId" type="hidden" />
        <label>
          正解
          <select name="optionId" required></select>
        </label>
        <label>
          確定メモ
          <textarea name="note" rows="3" maxlength="180" placeholder="参照した公式発表など"></textarea>
        </label>
        <button class="button dark" type="submit">確定してランキングへ反映</button>
      </form>
    </dialog>

    <script src="./supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./script.js"></script>
  </body>
</html>
